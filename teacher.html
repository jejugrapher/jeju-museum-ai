<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#F6F4F0; --card:#FFFFFF; --ink:#2B2620; --sub:#7C7264;
    --line:#E4DDD2; --mint:#3F9E85; --mint-l:#EAF7F3;
    --warn:#C9553D; --warn-l:#FDEEEA; --done:#B9B2A6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:16px 16px 60px;background:var(--bg);color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  .bar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 16px;margin-bottom:16px;position:sticky;top:8px;z-index:5;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .bar h1{font-size:19px;margin:0 14px 0 0;}
  .cnt{font-size:14px;color:var(--sub);margin-right:auto;}
  button{
    font-family:inherit;font-size:14px;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  button:hover{background:#F4F1EC;}
  button.p{background:var(--mint);border-color:var(--mint);color:#fff;}
  button.p:hover{filter:brightness(1.06);}
  button.d{border-color:#E2C4BC;color:var(--warn);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}

  .item{
    background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mint);
    border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .item.warn{border-left-color:var(--warn);background:var(--warn-l);}
  .item.ok{border-left-color:var(--done);opacity:.55;}

  .head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .seat{
    background:var(--mint-l);color:var(--mint);font-weight:800;font-size:14px;
    padding:4px 11px;border-radius:8px;
  }
  .time{font-size:12px;color:var(--sub);margin-left:auto;}

  .line{font-size:19px;line-height:1.55;margin-bottom:10px;word-break:keep-all;}
  .parts{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.7;}
  .parts b{color:#9A8F7E;font-weight:600;}

  .flag{
    font-size:12px;color:var(--warn);font-weight:700;
    background:#fff;border:1px solid #E2C4BC;border-radius:8px;
    padding:6px 10px;margin-bottom:10px;
  }

  .btns{display:flex;flex-wrap:wrap;gap:7px;}
  .btns button{font-size:13px;padding:8px 11px;}

  .empty{
    text-align:center;color:var(--sub);padding:70px 20px;font-size:15px;
    background:var(--card);border:1px dashed var(--line);border-radius:14px;
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#2B2620;color:#fff;padding:12px 22px;border-radius:10px;
    font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;
  }
  .toast.on{opacity:1;}
  #sink{position:fixed;left:-9999px;top:0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <h1>받은 문장</h1>
    <span class="cnt" id="cnt">불러오는 중…</span>
    <button id="scope">전체 보기</button>
    <button class="p" id="gemini">Gemini 열기</button>
    <button class="d" id="clear">오늘 것 지우기</button>
  </div>

  <div id="list"></div>
</div>

<textarea id="sink"></textarea>
<div class="toast" id="toast"></div>

<script>
  var showAll = false;
  var suffix  = '';
  var busy    = false;

  // 식별정보 의심 표시 (보조 도구. 최종 판단은 강사가 한다)
  var RISK = /(초등학교|중학교|고등학교|학교|유치원|[0-9]\s*학년|[0-9]\s*반|전화|휴대폰|010[-\s]?[0-9]|주소|아파트|우리집 주소)/;

  function $(id){ return document.getElementById(id); }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function toast(t){
    var el = $('toast');
    el.textContent = t;
    el.className = 'toast on';
    setTimeout(function(){ el.className = 'toast'; }, 1500);
  }

  function copy(text){
    var s = $('sink');
    s.value = text;
    s.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch(e) {}
    if (!done && navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){ toast('복사했습니다'); });
      return;
    }
    toast(done ? '복사했습니다' : '복사 실패 — 문장을 직접 선택해 주세요');
  }

  function render(res){
    suffix = res.suffix || '';
    var rows = res.rows || [];
    var wait = rows.filter(function(r){ return r.state !== '완료'; }).length;
    $('cnt').textContent = (showAll ? '전체 ' : '오늘 ') + rows.length + '개 · 대기 ' + wait + '개';

    if (rows.length === 0) {
      $('list').innerHTML = '<div class="empty">아직 들어온 문장이 없습니다.</div>';
      return;
    }

    var html = '<div class="grid">';
    rows.forEach(function(r){
      var risky = RISK.test(r.line);
      var done  = (r.state === '완료');
      var cls   = 'item' + (done ? ' ok' : (risky ? ' warn' : ''));

      html += '<div class="' + cls + '">';
      html +=   '<div class="head">';
      html +=     '<span class="seat">' + esc(r.seat || '-') + '번</span>';
      if (showAll) html += '<span class="time">' + esc(r.date) + '</span>';
      html +=     '<span class="time">' + esc(r.time) + '</span>';
      html +=   '</div>';

      if (risky) html += '<div class="flag">식별될 수 있는 말이 섞여 있는지 확인하세요</div>';

      html +=   '<div class="line">' + esc(r.line) + '</div>';
      html +=   '<div class="parts">' +
                  '<b>누가</b> ' + esc(r.who || '-') + ' · ' +
                  '<b>어디서</b> ' + esc(r.where || '-') + '<br>' +
                  '<b>어떻게</b> ' + esc(r.how || '-') + ' · ' +
                  '<b>무엇을</b> ' + esc(r.what || '-') +
                '</div>';

      html +=   '<div class="btns">';
      html +=     '<button class="p" data-copy="' + esc(r.line) + '">문장 복사</button>';
      html +=     '<button data-copy="' + esc(r.line + ' ' + suffix) + '">문장 + 그림체</button>';
      html +=     '<button data-state="' + esc(r.id) + '" data-to="' + (done ? '대기' : '완료') + '">' +
                    (done ? '되돌리기' : '완료 표시') + '</button>';
      html +=   '</div>';
      html += '</div>';
    });
    html += '</div>';

    $('list').innerHTML = html;

    var cbs = $('list').querySelectorAll('[data-copy]');
    for (var i = 0; i < cbs.length; i++) {
      cbs[i].onclick = function(){ copy(this.getAttribute('data-copy')); };
    }
    var sbs = $('list').querySelectorAll('[data-state]');
    for (var k = 0; k < sbs.length; k++) {
      sbs[k].onclick = function(){
        var id = this.getAttribute('data-state');
        var to = this.getAttribute('data-to');
        google.script.run.withSuccessHandler(function(){ load(); }).setState(id, to);
      };
    }
  }

  function load(){
    if (busy) return;
    busy = true;
    google.script.run
      .withSuccessHandler(function(res){ busy = false; render(res); })
      .withFailureHandler(function(){ busy = false; })
      .listRows(showAll);
  }

  $('scope').onclick = function(){
    showAll = !showAll;
    this.textContent = showAll ? '오늘만 보기' : '전체 보기';
    load();
  };

  $('gemini').onclick = function(){
    window.open('https://gemini.google.com/app', '_blank');
  };

  $('clear').onclick = function(){
    if (!confirm('오늘 들어온 문장을 모두 지웁니다. 진행할까요?')) return;
    google.script.run.withSuccessHandler(function(n){
      toast(n + '개를 지웠습니다');
      load();
    }).clearToday();
  };

  load();
  setInterval(load, 4000);
</script>
</body>
</html>
